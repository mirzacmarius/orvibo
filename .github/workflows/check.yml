name: Check
on:
  push:
    paths:
      - '**'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Keep in step with "packageManager" in package.json and the Bun
          # version Vercel uses for production builds (the "bun install"
          # line of a Vercel build log shows it).
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: 🔦 Run linter
        run: bun run lint
      - name: 🪐 Check TypeScript
        run: bun run typecheck
      - name: 🏗️ Build the website
        run: bunx turbo run build --filter=@v1/web
